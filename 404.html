<script>

  // Relative links would then point at the wrong folder, so find the site root and fix them.
  // On a local server, or when this file sits at the root, nothing changes.
  (function(){
    function fix(root){
      var nodes = document.querySelectorAll("[data-rel]");
      for (var i = 0; i < nodes.length; i++){
        var n = nodes[i], attr = n.tagName === "A" ? "href" : (n.hasAttribute("src") ? "src" : "href");
        n.setAttribute(attr, root + n.getAttribute("data-rel"));
      }
    }
    var parts = location.pathname.split("/").filter(Boolean);
    if (location.protocol === "file:" || parts.length < 2) return;
    var candidates = ["/" + parts[0] + "/", "/"];
    function probe(i){
      if (i >= candidates.length || !window.fetch) return;
      fetch(candidates[i] + "favicon.svg", {method:"HEAD"}).then(function(r){
        var type = r.headers.get("content-type") || "";
        if (r.ok && type.indexOf("svg") !== -1) fix(candidates[i]); else probe(i + 1);
      }).catch(function(){ probe(i + 1); });
    }
    function start(){ probe(0); }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
  })();
</script>
